name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/197252344762/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1441743833@free-wifi-portal.iam.gserviceaccount.com'

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          channelId: live
          projectId: free-wifi-portal
